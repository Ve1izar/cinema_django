
<style>
    .fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
    }

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .preview-box {
        height: 350px;
        border: 2px dashed #adb5bd;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f8f9fa;
        transition: all 0.3s ease;
    }

    .preview-box:hover {
        border-color: #0d6efd;
        background: #e9ecef;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow-lg border-0 fade-in-up" style="border-radius: 15px;">
            <div class="card-header bg-dark text-white p-4" style="border-radius: 15px 15px 0 0;">
                <h2 class="fw-bold mb-0">
                    {{ form_title }}{% if movie %}: {{ movie.title }}{% endif %}
                </h2>
            </div>

            <div class="card-body p-5">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-7 pe-md-4">
                            {{ form.as_p }}
                        </div>

                        <div class="col-md-5 text-center mt-4 mt-md-0">
                            <p class="fw-bold text-muted mb-2">Прев'ю постера</p>
                            <div class="preview-box shadow-sm mb-3">
                                <img id="posterPreview"
                                    src="{% if movie and movie.poster %}{{ movie.poster.url }}{% else %}/media/posters/no-image.jpg{% endif %}"
                                    alt="Preview" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                            </div>
                            <small class="text-muted">Оберіть файл зліва, щоб побачити його тут.</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4 border-top pt-4">
                        <a href="{% url 'custom_admin_panel' %}" class="btn btn-outline-secondary px-4">Скасувати</a>
                        <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm">
                            {{ action_title }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const posterInput = document.getElementById('id_poster');
        const previewImg = document.getElementById('posterPreview');

        if (posterInput) {
            posterInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (file) {
                    previewImg.src = URL.createObjectURL(file);
                }
            });
        }
    });
</script>
