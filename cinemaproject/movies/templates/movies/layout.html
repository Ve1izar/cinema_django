<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кінотеатр{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .interactive-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease !important;
            cursor: pointer;
        }
    
        .interactive-card:hover {
            transform: translateY(-10px) scale(1.03) rotate(1.5deg) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important;
            z-index: 10;
        }
    
        .btn {
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
    
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="{% url 'movie_list' %}">🎬 CinemaProject</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fs-5">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'movie_list' %}">Афіша</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'movie_history' %}">Історія переглядів</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'watchlist_view' %}">📌 Заплановані (<span class="fw-bold text-white">{{request.session.watchlist|length|default:"0" }}</span>)</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link btn btn-outline-light btn-sm px-3" href="{% url 'custom_admin_panel' %}">⚙️
                            Керування</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
